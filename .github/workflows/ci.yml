name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build first: `next build` generates next-env.d.ts and .next/types,
      # which the standalone typecheck below needs to resolve image imports
      # and route types on a fresh checkout.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
